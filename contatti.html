  <main class="page">
    <h1>Contattami</h1>
    <p>
      Compila il modulo qui sotto per inviarmi un messaggio.
      <br> Ti risponderò il prima possibile.
    </p>

    <nav class="site-navigation" aria-label="Navigazione principale">

      </ul>
    </nav>

    <section class="panel contact-section" aria-labelledby="contatti-title">
      <h2 id="contatti-title">Modulo di contatto</h2>
      <form action="mailto:michele.moltrasio@example.com" method="post" enctype="text/plain">
        <div class="form-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="messaggio">Messaggio</label>
          <textarea id="messaggio" name="messaggio" rows="5" required></textarea>
        </div>
        <button type="submit">Invia messaggio</button>
      </form>
    </section>
  </main>
